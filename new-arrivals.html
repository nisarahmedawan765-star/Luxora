<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Arrivals — LUXORA MARKET</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>
  <header class="main-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <img src="assets/images/luxora-market-logo-web.png" alt="LUXORA MARKET" class="lx-logo-img" />
      </a>
      <div style="color: var(--color-white); font-weight: 700;">✨ Latest New Arrivals</div>
      <div class="header-actions">
        <a href="cart.html" class="header-action-item"><span class="header-action-icon">🛒 <span class="badge-count cart-count-badge">0</span></span></a>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top: 30px; margin-bottom: 60px;">
    <div class="section-title-wrap">
      <h1 class="section-title"><span class="title-accent"></span>Newly Added 2026 Luxury Releases</h1>
      <a href="shop.html" class="btn btn-outline btn-sm">Browse All</a>
    </div>
    <div class="products-grid" id="new-arrivals-page-grid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const prods = window.luxoraDB.getProducts().filter(p => p.is_new_arrival !== false && p.status !== 'archived');
      const grid = document.getElementById('new-arrivals-page-grid');
      if (grid) {
        grid.innerHTML = prods.length > 0
          ? prods.map(p => window.LuxoraProducts.renderProductCard(p)).join('')
          : '<div style="grid-column:1/-1;text-align:center;padding:40px;">No new arrivals found.</div>';
      }
    });
  </script>
</body>
</html>
