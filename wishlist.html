<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wishlist — LUXORA MARKET</title>
  
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>

  <!-- Header -->
  <header class="main-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <img src="assets/images/luxora-market-logo-web.png" alt="LUXORA MARKET" class="lx-logo-img" />
      </a>
      <div style="font-weight: 700; color: var(--color-white); font-size: 1.2rem;">
        ♥ Saved Wishlist (<span class="wishlist-count-badge">0</span>)
      </div>
      <div class="header-actions">
        <a href="cart.html" class="header-action-item"><span class="header-action-icon">🛒 <span class="badge-count cart-count-badge">0</span></span></a>
        <a href="account.html" class="header-action-item"><span class="header-action-icon">👤</span></a>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top: 30px; margin-bottom: 60px;">
    <div class="section-title-wrap">
      <h1 class="section-title"><span class="title-accent"></span>My Saved Luxury Items</h1>
      <a href="shop.html" class="btn btn-outline btn-sm">Explore More Products</a>
    </div>

    <!-- Wishlist Grid -->
    <div class="products-grid" id="wishlist-products-grid">
      <!-- Rendered by JS -->
    </div>

    <!-- Empty Wishlist View -->
    <div id="wishlist-empty-view" style="display: none; background: #FFFFFF; padding: 80px 20px; text-align: center; border-radius: var(--radius-lg); border: 1px solid var(--color-border-light);">
      <div style="font-size: 4rem; margin-bottom: 16px;">♥</div>
      <h2 style="font-size: 1.6rem; margin-bottom: 8px;">Your Wishlist is Empty</h2>
      <p style="color: var(--color-text-muted); margin-bottom: 24px;">Click the heart icon on any product to save it to your personal wishlist.</p>
      <a href="shop.html" class="btn btn-green btn-lg">Explore Luxury Catalog</a>
    </div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav">
    <a href="index.html" class="mobile-nav-item"><span>🏠</span><span>Home</span></a>
    <a href="shop.html" class="mobile-nav-item"><span>🛍️</span><span>Shop</span></a>
    <a href="wishlist.html" class="mobile-nav-item active"><span>♥</span><span>Wishlist</span></a>
    <a href="cart.html" class="mobile-nav-item"><span>🛒</span><span>Cart</span></a>
    <a href="account.html" class="mobile-nav-item"><span>👤</span><span>Account</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    function renderWishlistPage() {
      const wishlist = window.luxoraWishlist;
      const ids = wishlist.items;

      if (ids.length === 0) {
        document.getElementById('wishlist-products-grid').style.display = 'none';
        document.getElementById('wishlist-empty-view').style.display = 'block';
        return;
      }

      document.getElementById('wishlist-products-grid').style.display = 'grid';
      document.getElementById('wishlist-empty-view').style.display = 'none';

      const products = ids.map(id => window.luxoraDB.getProductById(id)).filter(Boolean);
      document.getElementById('wishlist-products-grid').innerHTML = products.map(p => window.LuxoraProducts.renderProductCard(p)).join('');
    }

    document.addEventListener('DOMContentLoaded', renderWishlistPage);
  </script>
</body>
</html>
