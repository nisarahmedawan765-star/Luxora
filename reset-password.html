<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — LUXORA MARKET</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body style="background: linear-gradient(135deg, #07070A 0%, #12121A 100%); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px 16px;">

  <header style="margin-bottom: 24px; text-align: center;">
    <a href="index.html" class="brand-logo" style="justify-content: center;">
      <img src="assets/images/luxora-market-logo-web.png" alt="LUXORA MARKET" class="brand-logo-img" />
    </a>
  </header>

  <main style="max-width: 440px; width: 100%; margin: auto;">
    <div style="background: #FFFFFF; border-radius: 16px; padding: 36px 32px; box-shadow: 0 20px 45px rgba(0,0,0,0.5); border: 1px solid rgba(242,189,18,0.25);">
      <h1 style="font-size: 1.5rem; font-weight: 800; color: #111827; margin-bottom: 6px; text-align: center;">Set New Password</h1>
      <p style="color: #6B7280; font-size: 0.85rem; text-align: center; margin-bottom: 24px;">Please create a secure password for your Luxora account.</p>

      <form onsubmit="handleSetNewPassword(event)">
        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label" style="font-weight: 600; color: #374151;">New Password</label>
          <input type="password" id="new-password" class="form-input" placeholder="••••••••" required />
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label class="form-label" style="font-weight: 600; color: #374151;">Confirm New Password</label>
          <input type="password" id="confirm-new-password" class="form-input" placeholder="••••••••" required />
        </div>

        <button type="submit" id="btn-save-new-pwd" class="btn btn-green btn-block btn-lg" style="box-shadow: 0 4px 14px rgba(22,163,74,0.3); font-weight: 700;">
          Update Password
        </button>
      </form>
    </div>
  </main>

  <div id="lx-toast" style="position: fixed; bottom: 24px; right: 24px; z-index: 9999; padding: 14px 22px; border-radius: 8px; font-weight: 700; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5);"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('lx-toast');
      toast.textContent = (type === 'success' ? '✅ ' : '❌ ') + msg;
      toast.style.background = type === 'success' ? '#16A34A' : '#DC2626';
      toast.style.color = '#FFFFFF';
      toast.style.display = 'block';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    async function handleSetNewPassword(e) {
      e.preventDefault();
      const pwd = document.getElementById('new-password').value;
      const conf = document.getElementById('confirm-new-password').value;

      if (pwd !== conf) {
        showToast('Passwords do not match.', 'error');
        return;
      }
      if (pwd.length < 6) {
        showToast('Password must be at least 6 characters.', 'error');
        return;
      }

      const btn = document.getElementById('btn-save-new-pwd');
      btn.disabled = true;
      btn.textContent = 'Updating Password...';

      try {
        if (window.supabaseClient) {
          const { error } = await window.supabaseClient.auth.updateUser({ password: pwd });
          if (error) throw error;
        }
        showToast('Password updated successfully! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);
      } catch (err) {
        showToast(err.message || 'Failed to update password.', 'error');
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    }
  </script>
</body>
</html>
