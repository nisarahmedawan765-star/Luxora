<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Placed Successfully — LUXORA MARKET</title>
  
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body style="background: #F8F9FA;">

  <!-- Header -->
  <header class="main-header" style="padding: 14px 0;">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <img src="assets/images/luxora-market-logo-web.png" alt="LUXORA MARKET" class="lx-logo-img" />
      </a>
      <a href="index.html" class="btn btn-outline-gold btn-sm">← Storefront</a>
    </div>
  </header>

  <main class="container" style="max-width: 760px; margin: 40px auto 80px auto;">
    <div style="background: #FFFFFF; border-radius: var(--radius-lg); border: 1px solid var(--color-border-light); padding: 48px 36px; text-align: center; box-shadow: var(--shadow-md);">
      
      <div style="width: 72px; height: 72px; background: var(--color-green-light); color: var(--color-green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; margin: 0 auto 20px auto;">
        ✓
      </div>

      <span class="badge badge-green" style="margin-bottom: 12px;">ORDER CONFIRMED</span>
      <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 10px;">Thank You for Your Order!</h1>
      <p style="color: var(--color-text-muted); font-size: 1rem; margin-bottom: 24px;">Your order has been safely placed and dispatched for fulfillment by our luxury concierge.</p>

      <div style="background: #F9FAFB; border-radius: var(--radius-md); padding: 20px; text-align: left; margin-bottom: 30px; border: 1px solid var(--color-border-light);">
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--color-border-light); padding-bottom: 12px; margin-bottom: 12px;">
          <span>Order Number:</span>
          <strong id="success-order-num" style="color: var(--color-black); font-size: 1.1rem;">LX-2026-0000</strong>
        </div>
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--color-border-light); padding-bottom: 12px; margin-bottom: 12px;">
          <span>Estimated Delivery:</span>
          <strong style="color: var(--color-green);">3 - 5 Business Days (Insured)</strong>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span>Payment Status:</span>
          <span class="badge badge-green">Authorized / COD</span>
        </div>
      </div>

      <div style="display: flex; gap: 14px; justify-content: center;">
        <a href="track-order.html" class="btn btn-green btn-lg">📍 Track Live Order</a>
        <a href="shop.html" class="btn btn-outline btn-lg">Continue Shopping</a>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const orderNum = new URLSearchParams(window.location.search).get('order') || 'LX-892104';
      document.getElementById('success-order-num').textContent = orderNum;
    });
  </script>
</body>
</html>
