<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash & Mega Deals — LUXORA MARKET</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body>
  <!-- Header -->
  <header class="main-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <img src="assets/images/luxora-market-logo-web.png" alt="LUXORA MARKET" class="lx-logo-img" />
      </a>
      <div style="color: var(--color-gold); font-weight: 700; font-size: 1.2rem;">🔥 Exclusive Flash & Mega Deals</div>
      <div class="header-actions">
        <a href="cart.html" class="header-action-item"><span class="header-action-icon">🛒 <span class="badge-count cart-count-badge">0</span></span></a>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top: 30px; margin-bottom: 60px;">
    <!-- Flash Deals Section with Countdown -->
    <div class="flash-deals-header">
      <div class="flash-deals-title">⚡ ACTIVE FLASH PROMOTIONS</div>
      <div class="countdown-box">
        <span class="countdown-item" id="countdown-days">02</span><span class="countdown-sep">:</span>
        <span class="countdown-item" id="countdown-hours">18</span><span class="countdown-sep">:</span>
        <span class="countdown-item" id="countdown-mins">45</span><span class="countdown-sep">:</span>
        <span class="countdown-item" id="countdown-secs">30</span>
      </div>
    </div>
    <div class="flash-deals-body">
      <div class="products-grid" id="deals-grid"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const prods = window.luxoraDB.getProducts().filter(p => p.sale_price && p.sale_price < p.price);
      document.getElementById('deals-grid').innerHTML = prods.map(p => window.LuxoraProducts.renderProductCard(p)).join('');
    });
  </script>
</body>
</html>
