<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — LUXORA MARKET</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
  <style>
    body {
      background: linear-gradient(135deg, #07070A 0%, #12121A 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px 16px;
    }
    .auth-wrapper {
      max-width: 880px;
      width: 100%;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      background: #FFFFFF;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      border: 1px solid rgba(242,189,18,0.25);
    }
    .auth-banner {
      background: linear-gradient(180deg, #09090E 0%, #151522 100%);
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border-right: 1px solid rgba(242,189,18,0.15);
    }
    .auth-form-card {
      padding: 44px 38px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .social-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      border: 1.5px solid #E5E7EB;
    }
    .social-btn-google {
      background: #FFFFFF;
      color: #1F2937;
    }
    .social-btn-google:hover {
      background: #F9FAFB;
      border-color: #D1D5DB;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .social-btn-facebook {
      background: #1877F2;
      color: #FFFFFF;
      border-color: #1877F2;
    }
    .social-btn-facebook:hover {
      background: #166FE5;
      box-shadow: 0 4px 12px rgba(24,119,242,0.3);
    }
    .divider-text {
      display: flex;
      align-items: center;
      text-align: center;
      color: #9CA3AF;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 20px 0;
    }
    .divider-text::before, .divider-text::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #E5E7EB;
    }
    .divider-text:not(:empty)::before { margin-right: 14px; }
    .divider-text:not(:empty)::after { margin-left: 14px; }

    @media (max-width: 768px) {
      .auth-wrapper {
        grid-template-columns: 1fr;
        max-width: 440px;
      }
      .auth-banner {
        display: none;
      }
      .auth-form-card {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <!-- Left Hero Banner (Reference Screen 4) -->
    <div class="auth-banner">
      <div>
        <a href="index.html" class="brand-logo" style="margin-bottom: 24px; display: inline-block;">
          <img src="assets/images/luxora-market-logo-web.png" alt="LUXORA MARKET" class="brand-logo-img" style="height: 48px;" />
        </a>
        <h2 style="color: #FFFFFF; font-size: 1.8rem; font-weight: 800; margin-top: 14px; line-height: 1.2;">Welcome Back</h2>
        <p style="color: #94A3B8; font-size: 0.88rem; margin-top: 8px; line-height: 1.5;">
          Sign in to continue your luxury shopping journey and access your exclusive concierge benefits.
        </p>
      </div>

      <div style="text-align: center; margin: 30px 0;">
        <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500&q=85" alt="Luxury Horology" 
             style="width: 200px; height: 200px; object-fit: cover; border-radius: 50%; border: 3px solid rgba(242,189,18,0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.8); margin: auto; display: block;" />
      </div>

      <div style="font-size: 0.78rem; color: #64748B; text-align: center;">
        🔒 256-Bit SSL Encrypted Luxury Marketplace
      </div>
    </div>

    <!-- Right Form Section -->
    <div class="auth-form-card">
      <div style="text-align: center; margin-bottom: 22px;">
        <h1 style="font-size: 1.6rem; font-weight: 800; color: #111827; margin-bottom: 6px;">Sign In to Luxora</h1>
        <p style="color: #6B7280; font-size: 0.85rem;">Enter your credentials to access your luxury account</p>
      </div>

      <div id="login-alert" style="display: none; padding: 12px 16px; border-radius: 10px; margin-bottom: 18px; font-size: 0.85rem; font-weight: 600; line-height: 1.4;"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label" style="font-weight: 600; color: #374151;">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="Enter your email address" required autocomplete="email" />
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" style="margin-bottom: 0; font-weight: 600; color: #374151;">Password</label>
            <a href="forgot-password.html" style="font-size: 0.8rem; color: var(--color-green); text-decoration: none; font-weight: 600;">Forgot password?</a>
          </div>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" id="btn-submit-signin" class="btn btn-green btn-block btn-lg" style="box-shadow: 0 4px 14px rgba(22,163,74,0.3); font-weight: 700;">
          Sign In
        </button>

        <div class="divider-text">OR</div>

        <!-- Social Authentication Buttons (Real Supabase Auth) -->
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <!-- Continue with Google -->
          <button type="button" class="social-btn social-btn-google" onclick="handleSocialAuth('google')">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            Continue with Google
          </button>

          <!-- Continue with Facebook -->
          <button type="button" class="social-btn social-btn-facebook" onclick="handleSocialAuth('facebook')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Continue with Facebook
          </button>
        </div>

        <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: #6B7280;">
          Don't have an account? <a href="register.html" style="color: var(--color-green); font-weight: 700; text-decoration: none;">Create Account</a>
        </div>
      </form>
    </div>
  </div>

  <div id="lx-toast" style="position: fixed; bottom: 24px; right: 24px; z-index: 9999; padding: 14px 22px; border-radius: 8px; font-weight: 700; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5);"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/role-guard.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function showAlert(msg, isSuccess = false) {
      const alertBox = document.getElementById('login-alert');
      if (!alertBox) return;
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
      alertBox.style.background = isSuccess ? '#DCFCE7' : '#FEE2E2';
      alertBox.style.color = isSuccess ? '#15803D' : '#B91C1C';
      alertBox.style.border = isSuccess ? '1px solid #86EFAC' : '1px solid #FECACA';
    }

    function hideAlert() {
      const alertBox = document.getElementById('login-alert');
      if (alertBox) alertBox.style.display = 'none';
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('lx-toast');
      if (!toast) return;
      toast.textContent = (type === 'success' ? '✅ ' : '❌ ') + msg;
      toast.style.background = type === 'success' ? '#16A34A' : '#DC2626';
      toast.style.color = '#FFFFFF';
      toast.style.display = 'block';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    async function handleLogin(event) {
      event.preventDefault();
      hideAlert();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-submit-signin');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const user = await window.luxoraAuth.login(email, password);
        showAlert(`Welcome back, ${user.full_name || 'Member'}! Directing to your account...`, true);

        setTimeout(() => {
          // Strictly adhere to role destinations
          if (user.role === 'admin' || user.role === 'super_admin') {
            window.location.href = 'admin/dashboard.html';
          } else if (user.role === 'seller') {
            if (user.seller_status === 'pending' || user.seller_status === 'under_review') {
              window.location.href = 'seller/register.html';
            } else if (user.seller_status === 'rejected') {
              window.location.href = 'seller/register.html';
            } else {
              window.location.href = 'seller/dashboard.html';
            }
          } else {
            // Customer -> Customer Account
            window.location.href = 'account.html';
          }
        }, 500);
      } catch (err) {
        showAlert(err.message || 'Invalid email or password.');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    async function handleSocialAuth(provider) {
      hideAlert();
      const providerName = provider === 'google' ? 'Google' : 'Facebook';
      try {
        showToast(`Connecting to ${providerName}...`, 'success');
        await window.luxoraAuth.loginWithOAuth(provider);
      } catch (err) {
        showAlert(err.message || `${providerName} sign-in is currently unavailable.`);
        showToast(err.message || `${providerName} sign-in is currently unavailable.`, 'error');
      }
    }

    // Auto-route or process OAuth callback
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Check for incoming OAuth redirect callback or errors
      if (window.location.hash || window.location.search.includes('code=')) {
        if (window.luxoraAuth) {
          const cb = await window.luxoraAuth.handleOAuthCallback();
          if (cb) {
            if (cb.success) {
              showAlert(`Welcome back, ${cb.profile?.full_name || 'Member'}! Redirecting...`, true);
              showToast('Signed in successfully!', 'success');
              setTimeout(() => {
                window.location.href = cb.destination;
              }, 600);
              return;
            } else if (cb.error) {
              showAlert(cb.error, false);
              showToast(cb.error, 'error');
            }
          }
        }
      }

      // 2. Auto-route if already logged in with valid DB role
      const user = await window.LuxoraRoleGuard.init();
      if (user) {
        if (user.role === 'admin' || user.role === 'super_admin') {
          window.location.href = 'admin/dashboard.html';
        } else if (user.role === 'seller' && user.seller_status === 'approved') {
          window.location.href = 'seller/dashboard.html';
        } else {
          window.location.href = 'account.html';
        }
      }
    });
  </script>
</body>
</html>
