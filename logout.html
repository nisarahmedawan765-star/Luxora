<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logged Out — LUXORA MARKET</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body style="background: linear-gradient(135deg, #0B0B0B 0%, #151515 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;">

  <header style="margin-bottom: 28px; text-align: center;">
    <a href="index.html" class="brand-logo" style="justify-content: center;">
      <img src="assets/images/luxora-market-logo-web.png" alt="LUXORA MARKET" class="brand-logo-img" />
    </a>
  </header>

  <main style="max-width: 440px; width: 100%;">
    <div style="background: #111116; border: 1px solid rgba(242, 189, 18, 0.2); border-radius: var(--radius-lg); padding: 44px 32px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
      
      <!-- Green Checkmark Circle -->
      <div style="width: 72px; height: 72px; border-radius: 50%; background: rgba(22, 163, 74, 0.15); border: 2px solid #22C55E; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 2rem; color: #22C55E;">
        ✓
      </div>

      <h2 style="color: #FFFFFF; font-size: 1.5rem; font-weight: 800; margin-bottom: 8px;">You have been logged out!</h2>
      <p style="color: #94A3B8; font-size: 0.9rem; margin-bottom: 28px;">Thank you for visiting Luxora Market.</p>

      <a href="login.html" class="btn btn-green btn-block btn-lg" style="margin-bottom: 14px; text-decoration: none; display: block; padding: 14px; font-weight: 700;">
        Go to Sign In
      </a>

      <a href="index.html" style="color: var(--color-gold); font-size: 0.85rem; text-decoration: none; font-weight: 600;">
        ← Back to Home
      </a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    // Ensure all local auth states are purged
    localStorage.removeItem('luxora_user');
    sessionStorage.removeItem('luxora_user');
    if (window.supabaseClient) {
      window.supabaseClient.auth.signOut().catch(() => {});
    }
  </script>
</body>
</html>
