<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — LUXORA MARKET</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>
<body style="background: #F8F9FA;">

  <!-- Header -->
  <header class="main-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <img src="assets/images/luxora-market-logo-web.png" alt="LUXORA MARKET" class="lx-logo-img" />
      </a>
      <div style="font-weight: 700; color: var(--color-white);">📦 Order History</div>
      <div><a href="account.html" class="btn btn-outline-gold btn-sm">← Account Overview</a></div>
    </div>
  </header>

  <main class="container" style="margin-top: 30px; margin-bottom: 60px;">
    <div class="section-title-wrap">
      <h1 class="section-title"><span class="title-accent"></span>All Placed Luxury Orders</h1>
      <a href="track-order.html" class="btn btn-green btn-sm">📍 Live Courier Tracking</a>
    </div>

    <div style="background: #FFFFFF; border-radius: var(--radius-lg); border: 1px solid var(--color-border-light); padding: 24px; box-shadow: var(--shadow-sm);">
      <div style="display: flex; flex-direction: column; gap: 18px;" id="customer-orders-history-list">
        <!-- Injected by JS -->
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/orders.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const orders = window.luxoraDB.getOrders();
      const wrap = document.getElementById('customer-orders-history-list');

      if (orders.length === 0) {
        wrap.innerHTML = `
          <div style="border: 1px solid var(--color-border-light); border-radius: var(--radius-md); padding: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div>
              <div style="font-weight: 800; font-size: 1.1rem; color: var(--color-black);">Order #LX-892104</div>
              <div style="font-size: 0.85rem; color: var(--color-text-muted);">Placed on August 21, 2026 • 1 item • Standard Delivery</div>
              <div style="margin-top: 8px; font-size: 0.9rem;"><strong>Sony WH-1000XM5 Wireless Headphones</strong></div>
            </div>
            <div style="text-align: right;">
              <span class="badge badge-active">Processing</span>
              <div style="font-size: 1.2rem; font-weight: 800; color: var(--color-black); margin-top: 4px;">Rs. 79,999</div>
            </div>
            <div style="display: flex; gap: 8px;">
              <a href="track-order.html" class="btn btn-green btn-sm">📍 Track Live</a>
              <button onclick="window.LuxoraOrders.requestReturn('LX-892104')" class="btn btn-outline btn-sm">Request Return</button>
            </div>
          </div>
        `;
      } else {
        wrap.innerHTML = orders.map(o => `
          <div style="border: 1px solid var(--color-border-light); border-radius: var(--radius-md); padding: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div>
              <div style="font-weight: 800; font-size: 1.1rem; color: var(--color-black);">Order #${o.order_number}</div>
              <div style="font-size: 0.85rem; color: var(--color-text-muted);">Placed on ${new Date(o.created_at).toLocaleDateString()} • ${o.items ? o.items.length : 1} item(s)</div>
            </div>
            <div style="text-align: right;">
              <span class="badge badge-active">${o.order_status}</span>
              <div style="font-size: 1.2rem; font-weight: 800; color: var(--color-black); margin-top: 4px;">Rs. ${Number(o.grand_total).toLocaleString()}</div>
            </div>
            <div style="display: flex; gap: 8px;">
              <a href="track-order.html" class="btn btn-green btn-sm">📍 Track</a>
              <button onclick="window.LuxoraOrders.cancelOrder('${o.order_number}')" class="btn btn-outline btn-sm" style="color: var(--color-red);">Cancel</button>
            </div>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
